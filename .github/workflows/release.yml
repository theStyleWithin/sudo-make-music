name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v1.0.0) after building. Leave empty to only build.'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: UI smoke test (headless; informational)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri xclip
          xvfb-run -a python tests/ui_smoke.py /tmp/shots

  py-compat:
    # The code claims Python >= 3.10 and the Android toolchain runs 3.11: catch newer-only syntax early.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: python -m compileall -q sudo_make_music main.py tools packaging

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: dist/*.AppImage }

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      # Code signing switches on automatically once these two repository secrets exist (see docs/SIGNING.md).
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build portable exe + folder build
        timeout-minutes: 45
        shell: pwsh
        run: ./packaging/windows/build.ps1 *>&1 | Tee-Object -FilePath build.log
      - name: Sign (only when a certificate is configured)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          foreach ($f in 'dist\sudo-make-music-portable.exe', 'dist\sudo-make-music\sudo-make-music.exe') {
            & $signtool sign /f cert.pfx /p $env:CERT_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "sudo make music" $f
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $f" }
            & $signtool verify /pa $f
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $f" }
          }
          Remove-Item cert.pfx
      - name: Note that the build is unsigned
        if: env.HAS_CERT != 'true'
        run: echo "::notice title=unsigned::No code-signing certificate is configured; the Windows files are UNSIGNED (SmartScreen will warn)."
      - name: Self-check both builds (they must really run)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $fail = $false
          foreach ($t in @(@('dist\sudo-make-music-portable.exe', 'selfcheck-portable.txt'), @('dist\sudo-make-music\sudo-make-music.exe', 'selfcheck-folder.txt'))) {
            $p = Start-Process -FilePath ("./" + $t[0]) -ArgumentList '--selfcheck', $t[1] -Wait -PassThru
            $report = if (Test-Path $t[1]) { (Get-Content $t[1]) -join '%0A' } else { 'no report was written: the exe did not start' }
            Write-Host "::notice title=selfcheck $($t[0])::$report"
            if ($p.ExitCode -ne 0 -or -not (Test-Path $t[1])) { Write-Host "::error title=selfcheck FAILED $($t[0])::$report"; $fail = $true }
          }
          if ($fail) { exit 1 }
      - name: Zip the folder build
        shell: pwsh
        run: Compress-Archive -Path dist\sudo-make-music -DestinationPath dist\sudo-make-music-windows-folder.zip
      - name: Report build tail on failure
        if: failure() || cancelled()
        shell: pwsh
        run: |
          $t = (Get-Content build.log -Tail 40 -ErrorAction SilentlyContinue) -join '%0A'
          Write-Host "::error title=windows build tail::$t"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/sudo-make-music-portable.exe
            dist/sudo-make-music-windows-folder.zip
          if-no-files-found: error

  android:
    needs: [test, py-compat]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    name: android (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two toolchains are tried side by side until one is proven; the APK name says which built it.
          - name: legacy
            p4a: v2024.01.21
            buildozer: 'buildozer==1.5.0'
            cython: 'cython==0.29.37'
          - name: modern
            p4a: v2026.05.09
            buildozer: 'buildozer'
            cython: 'cython<3.1'
    env:
      CCACHE_DISABLE: '1'   # the ccache wrapper broke numpy's link step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: System packages for python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential libltdl-dev
      - run: pip install '${{ matrix.buildozer }}' '${{ matrix.cython }}' setuptools wheel
      - name: Select the python-for-android release
        run: |
          sed -i "s/^p4a.branch = .*/p4a.branch = ${{ matrix.p4a }}/" buildozer.spec
          if [ "${{ matrix.name }}" = "modern" ]; then sed -i '/^android.ndk = /d;/^android.api = /d' buildozer.spec; fi
          grep -nE '^(p4a|android)\.' buildozer.spec
      - name: Build debug APK
        timeout-minutes: 60
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show build errors and bin/ (always)
        if: always()
        run: |
          # buildozer prints its own "# Run/# Cwd/# Command failed" block AFTER the failing command's output,
          # so drop those lines and look at what came right before.
          sed -E 's/\x1b\[[0-9;]*m//g' build.log 2>/dev/null | grep -vE '^# ' > clean.log || true
          e=$(grep -nE '\[ERROR\]|Traceback \(most recent|^[A-Za-z]+Error:|error: |CMake Error|make(\[[0-9]+\])?: \*\*\*|fatal error|FAILED:|Exception:|No matching distribution|Could not find|ERROR:' clean.log | tail -25 | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          t=$(tail -n 40 clean.log 2>/dev/null | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          f=$(sed -E 's/\x1b\[[0-9;]*m//g' build.log 2>/dev/null | grep -E '^# (Command failed|Error code|Buildozer failed)' | tail -4 | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          l=$(ls -la bin 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=android LAST error lines::$e"
          echo "::notice title=android last 40 log lines::$t"
          echo "::notice title=android failure summary::$f"
          echo "::notice title=android bin/::$l"
      - name: Collect the APK
        run: |
          apk=$(find bin -maxdepth 2 -name '*.apk' 2>/dev/null | head -n 1)
          if [ -z "$apk" ]; then apk=$(find .buildozer -name '*debug*.apk' -not -path '*/intermediates/*' 2>/dev/null | head -n 1); fi
          echo "apk=$apk"
          if [ -z "$apk" ]; then
            echo "::error title=No APK produced::buildozer finished but no .apk file was found"
            exit 1
          fi
          cp "$apk" "sudo-make-music-android-${{ matrix.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.name }}
          path: sudo-make-music-android-${{ matrix.name }}.apk
          if-no-files-found: error

  release:
    # Publish whatever built: one failing platform must not block the others.
    if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '') && always() && needs.test.result == 'success'
    needs: [test, appimage, windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - name: Check the release tag looks like v1.0.0
        if: github.event.inputs.release_tag != ''
        env:
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error title=Bad release tag::The release tag must look like v1.0.0 (got '$TAG'). Nothing was published."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attest build provenance (free proof these files came from this repo's CI)
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'out/*'
      - name: Publish release
        id: rel1
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: sudo make music ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: docs/RELEASE_NOTES_1.0.md
          draft: false
          files: out/*
      - name: Publish release (retry once - uploads can fail transiently)
        if: steps.rel1.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: sudo make music ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: docs/RELEASE_NOTES_1.0.md
          draft: false
          files: out/*
