name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: UI smoke test (headless; informational)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri xclip
          xvfb-run -a python tests/ui_smoke.py /tmp/shots

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: dist/*.AppImage }

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build portable exe
        timeout-minutes: 30
        shell: pwsh
        run: ./packaging/windows/build.ps1 *>&1 | Tee-Object -FilePath build.log
      - name: Report build tail on failure
        if: failure() || cancelled()
        shell: pwsh
        run: |
          $t = (Get-Content build.log -Tail 40 -ErrorAction SilentlyContinue) -join '%0A'
          Write-Host "::error title=windows build tail::$t"
      - uses: actions/upload-artifact@v4
        with: { name: windows-portable, path: dist/sudo-make-music-portable.exe }

  android:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: System packages for python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache libltdl-dev
      - run: pip install buildozer 'cython<3.1' setuptools wheel
      - name: Build debug APK
        timeout-minutes: 60
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Report build tail on failure
        if: failure() || cancelled()
        run: |
          t=$(tail -n 40 build.log 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=android build tail::$t"
      - run: ls -la bin/
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: 'bin/*.apk' }

  release:
    # Publish whatever built: one failing platform must not block the others.
    if: startsWith(github.ref, 'refs/tags/v') && always() && needs.test.result == 'success'
    needs: [test, appimage, windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: sudo make music ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_1.0.md
          files: out/*
