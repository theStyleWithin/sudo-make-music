app-id: io.github.theStyleWithin.SudoMakeMusic
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: sudo-make-music
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=all            # GPU access (CUDA also needs the host NVIDIA driver via the GL extension)
  - --share=network         # only for the one-time AI backend + model download
  - --filesystem=xdg-music  # save exported songs to ~/Music
modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-deps kivy numpy kivy-garden docutils filetype pygments requests charset-normalizer idna urllib3 certifi
