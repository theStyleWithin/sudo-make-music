  - name: sudo-make-music
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/lib/sudo-make-music
      - cp -r sudo_make_music ${FLATPAK_DEST}/lib/sudo-make-music/
      - |
        cat > sudo-make-music <<'WRAP'
        #!/bin/sh
        PYV=$(python3 -c 'import sys;print("%d.%d"%sys.version_info[:2])')
        export PYTHONPATH=/app/lib/sudo-make-music:/app/lib/python$PYV/site-packages${PYTHONPATH:+:$PYTHONPATH}
        exec python3 -m sudo_make_music "$@"
        WRAP
      - install -Dm755 sudo-make-music ${FLATPAK_DEST}/bin/sudo-make-music
      - install -Dm644 packaging/common/io.github.theStyleWithin.SudoMakeMusic.desktop ${FLATPAK_DEST}/share/applications/io.github.theStyleWithin.SudoMakeMusic.desktop
      - install -Dm644 packaging/common/io.github.theStyleWithin.SudoMakeMusic.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.theStyleWithin.SudoMakeMusic.metainfo.xml
      - install -Dm644 packaging/common/io.github.theStyleWithin.SudoMakeMusic.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.theStyleWithin.SudoMakeMusic.svg
    sources:
      - type: git
        url: https://github.com/theStyleWithin/sudo-make-music.git
        tag: v1.0.0
        # Flathub requires the commit too: set `commit:` to the output of `git rev-parse v1.0.0`
