app-id: io.github.theStyleWithin.SudoMakeMusic
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: sudo-make-music
finish-args:
  - --share=network        # first-run backend + model download; local web UI on 127.0.0.1
  - --device=all           # GPU access (CUDA needs the host NVIDIA driver via the GL extension)
  - --filesystem=xdg-music # optional: save songs where users keep music
modules:
  - name: numpy
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-deps numpy
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/da/24/3bd070f3269dc609d8f26b2643f62ef91bb415841c0b294805aaf7fe06da/numpy-2.5.4-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 6ffa07666f8da0eef81d149934a626d0d95fbd6838432a33e66245423a9062c0
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/db/b6/135bb0953b61dc21c6cafa14b424ae666944e4899cf140e00c2b322a1a45/numpy-2.5.4-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: 1c2e71b04c6cad90026e544501bbe0ab9290fa8a4d845e7e8c0d124fb429c988
        only-arches: [aarch64]

  - name: sudo-make-music
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/lib/sudo-make-music
      - cp -r sudo_make_music ${FLATPAK_DEST}/lib/sudo-make-music/
      - |
        cat > sudo-make-music <<'WRAP'
        #!/bin/sh
        PYV=$(python3 -c 'import sys;print("%d.%d"%sys.version_info[:2])')
        export PYTHONPATH=/app/lib/sudo-make-music:/app/lib/python$PYV/site-packages${PYTHONPATH:+:$PYTHONPATH}
        export SUDO_MAKE_MUSIC_HOME="${XDG_DATA_HOME:-$HOME/.local/share}/sudo-make-music"
        exec python3 -m sudo_make_music "$@"
        WRAP
      - install -Dm755 sudo-make-music ${FLATPAK_DEST}/bin/sudo-make-music
      - install -Dm644 packaging/common/io.github.theStyleWithin.SudoMakeMusic.desktop ${FLATPAK_DEST}/share/applications/io.github.theStyleWithin.SudoMakeMusic.desktop
      - install -Dm644 packaging/common/io.github.theStyleWithin.SudoMakeMusic.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.theStyleWithin.SudoMakeMusic.metainfo.xml
      - install -Dm644 packaging/common/io.github.theStyleWithin.SudoMakeMusic.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.theStyleWithin.SudoMakeMusic.svg
    sources:
      - type: git
        url: https://github.com/theStyleWithin/sudo-make-music.git
        tag: v0.1.0
        # Flathub requires the commit too; fill in with: git rev-parse v0.1.0
        # commit: <FILL ME>
